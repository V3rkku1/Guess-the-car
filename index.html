<!-- Single file, no framework/build/images: native <dialog>, CSS clip-path, plain JS. -->
<style>
:root{--bg1:#000428;--bg2:#004e92;--gold:#ffb800;--line:#9fb4ff;--ok:#1db954;--bad:#e53935;--sel:#ff8c00;--text:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 20%,var(--bg2),var(--bg1) 70%) fixed}
h1{text-align:center;color:var(--gold);margin:24px 16px 4px;font-size:clamp(1.4rem,4vw,2.4rem);text-shadow:0 0 12px #ffb80088}
.sub{text-align:center;opacity:.8;margin:0 16px 24px}
.screen{display:none;max-width:1100px;margin:0 auto;padding:0 16px 32px}
.screen.on{display:block}
#cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.cat,.ans,button.big{font:inherit;color:var(--text);cursor:pointer;border:2px solid var(--line);background:linear-gradient(#0a1a5c,#000a33)}
.cat{padding:18px;border-radius:12px;font-size:1.1rem;text-align:left}
.cat small{display:block;opacity:.7;font-size:.8rem;margin-top:4px}
.cat:hover{border-color:var(--gold)}.ans:not(:disabled):hover{filter:brightness(1.4)}
.game{display:grid;grid-template-columns:1fr 230px;gap:20px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.life{font:inherit;font-size:.95rem;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#000a33;color:var(--text);cursor:pointer}
.life:disabled{opacity:.3;text-decoration:line-through;cursor:default}
.top .spacer{flex:1}
.q{clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:linear-gradient(#0a1a5c,#000a33);border:0;padding:28px 8%;text-align:center;font-size:clamp(1.05rem,2.4vw,1.4rem);min-height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%);padding:16px 8%;text-align:left;font-size:1.05rem;min-height:58px;border:0;background:linear-gradient(#1a2f8a,#000a33)}
.ans b{color:var(--gold);margin-right:8px}
.ans:disabled{cursor:default}
.ans.hide{visibility:hidden}
.ans.sel{background:var(--sel);color:#000}
.ans.ok{background:var(--ok);animation:blink .3s 4}
.ans.bad{background:var(--bad)}
@keyframes blink{50%{filter:brightness(1.6)}}
.ladder{list-style:none;margin:0;padding:8px;border:2px solid var(--line);border-radius:12px;background:#000a33cc;display:flex;flex-direction:column-reverse;font-variant-numeric:tabular-nums}
.ladder li{padding:4px 10px;border-radius:6px;display:flex;justify-content:space-between;color:var(--gold)}
.ladder li.safe{color:#fff;font-weight:700}
.ladder li.cur{background:var(--sel);color:#000}
.ladder li.done{opacity:.5}
.meta{opacity:.8;font-size:.9rem;margin-top:14px;text-align:center}
dialog{background:linear-gradient(#0a1a5c,#000a33);color:var(--text);border:2px solid var(--gold);border-radius:16px;max-width:min(460px,calc(100vw - 32px));padding:24px}
dialog::backdrop{background:#000a}
dialog h2{margin-top:0;color:var(--gold)}
.bars{display:flex;gap:14px;align-items:flex-end;height:160px;margin:12px 0}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0}
button.big{padding:10px 22px;border-radius:999px;margin-top:12px;font-size:1rem}
@media (max-width:760px){.game{grid-template-columns:1fr}.ladder{display:none}.answers{grid-template-columns:1fr}}
</style>
</head>

        <button class="life" id="lphone">📞 Phone a friend</button>

</section>

const PRIZES = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
const SAFE = [4, 9];
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const euro = n => '€' + n.toLocaleString('en');

// Flatten brand data once: [{brand, country, models, cat}]. "Brand/Country:" overrides the category country.
const BRANDS = Object.entries(CATS).flatMap(([cat, c]) => c.brands.map(s => {
  const i = s.indexOf(':'), [brand, country = c.country] = s.slice(0, i).split('/');
  return {brand, country, cat, models: s.slice(i + 1).split(',')};
}));
// Drop model names used by 2+ brands so every question has exactly one right answer.
const seen = {};
BRANDS.forEach(b => b.models.forEach(m => seen[m.toLowerCase()] = (seen[m.toLowerCase()] || 0) + 1));
BRANDS.forEach(b => b.models = b.models.filter(m => seen[m.toLowerCase()] === 1));
const COUNTRIES = [...new Set(BRANDS.map(b => b.country))];
const trivia = (s, d) => { const [q, ...o] = s.split('|'); return {q, a: o[0], opts: o, d}; };

function questionPool(cat, d) {
  const cats = cat === 'All' ? Object.keys(CATS) : [cat];
  const brands = BRANDS.filter(b => cats.includes(b.cat));
  const others = b => { // distractor brands: same pool first, padded from all brands
    const same = shuffle(brands.filter(x => x.brand !== b.brand));
    return [...same, ...shuffle(BRANDS.filter(x => !same.includes(x) && x.brand !== b.brand))].slice(0, 3);
  };
  if (d === 1) {
    const qs = brands.flatMap(b => b.models.map(m => ({q: `Which brand makes the ${m}?`, a: b.brand, opts: [b.brand, ...others(b).map(x => x.brand)]})));
    if (cat === 'All' || cat === 'World') qs.push(...brands.map(b =>
      ({q: `Which country does ${b.brand} come from?`, a: b.country, opts: [b.country, ...shuffle(COUNTRIES.filter(c => c !== b.country)).slice(0, 3)]})));
    return qs;
  }
  const t = cats.flatMap(c => CATS[c]['t' + d].map(s => trivia(s, d)));
  if (d === 2) return [...t, ...brands.map(b => {
    const m = b.models[rnd(b.models.length)];
    return {q: `Which of these is a ${b.brand} model?`, a: m, opts: [m, ...others(b).map(x => x.models[rnd(x.models.length)])]};
  })];
  return t;
}

let S;
function start(cat) {
  S = {cat, level: 0, used: new Set(), life: {l50: 1, laud: 1, lphone: 1}, cur: null, busy: false};
  ['l50', 'laud', 'lphone', 'walk'].forEach(id => $(id).disabled = false);
  $('sub').textContent = `${cat === 'All' ? '🌍 All cars' : CATS[cat].flag + ' ' + cat + ' cars'}`;
  show('play');
  next();
}

function next() {
  const d = S.level < 5 ? 1 : S.level < 10 ? 2 : 3;
  // Fall back to easier pools if a hard pool runs dry.
  let pool = [];
  for (let k = d; k >= 1 && !pool.length; k--) pool = questionPool(S.cat, k).filter(x => !S.used.has(x.q));
  const q = pool[rnd(pool.length)];
  S.used.add(q.q);
  q.opts = shuffle(q.opts);
  console.assert(new Set(q.opts).size === 4 && q.opts.includes(q.a), 'bad question', q);
  S.cur = q; S.busy = false;
  $('q').textContent = q.q;
  $('answers').innerHTML = '';
  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'ans';
    b.innerHTML = `<b>${'ABCD'[i]}:</b>`;
    b.append(o);
    b.onclick = () => answer(b, o);
    $('answers').append(b);
  });
  $('status').textContent = `Question ${S.level + 1} of 15 — playing for ${euro(PRIZES[S.level])}`;
  renderLadder();
}

function renderLadder() {
  $('ladder').innerHTML = PRIZES.map((p, i) =>
    `<li class="${SAFE.includes(i) ? 'safe' : ''} ${i === S.level ? 'cur' : ''} ${i < S.level ? 'done' : ''}"><span>${i + 1}</span><span>${euro(p)}</span></li>`).join('');
}

const buttons = () => [...$('answers').children];
const lock = on => { buttons().forEach(b => b.disabled = on); ['l50', 'laud', 'lphone', 'walk'].forEach(id => $(id).disabled = on || (id !== 'walk' && !S.life[id])); };

function answer(btn, opt) {
  if (S.busy) return;
  S.busy = true;
  lock(true);
  btn.classList.add('sel');
  setTimeout(() => {
    const right = opt === S.cur.a;
    buttons().forEach(b => { if (b.lastChild.textContent === S.cur.a) b.classList.add('ok'); });
    if (!right) btn.classList.add('bad');
    setTimeout(() => {
      if (!right) {
        const safe = [...SAFE].reverse().find(i => i < S.level);
        return end(false, safe === undefined ? 0 : PRIZES[safe], `The correct answer was <b>${S.cur.a}</b>.`);
      }
      if (S.level === 14) return end(true, PRIZES[14], 'You answered all 15 questions!');
      S.level++;
      next();
      lock(false);
    }, 1800);
  }, 1500);
}

function dialog(title, html, btn = 'OK') {
  $('dt').textContent = title; $('db').innerHTML = html; $('dbtn').textContent = btn;
  $('dlg').showModal();
}

function end(won, amount, msg) {
  saveBest(amount);
  dialog(won ? '🏆 MILLIONAIRE!' : amount ? '💰 Game over' : '💥 Game over', `<p>${msg}</p><p>You leave with <b style="color:var(--gold)">${euro(amount)}</b>.</p>`, 'Back to categories');
  $('dlg').onclose = () => { $('dlg').onclose = null; show('menu'); };
}

function hidden() { return buttons().filter(b => b.classList.contains('hide')).map(b => b.lastChild.textContent); }

$('l50').onclick = () => {
  S.life.l50 = 0; $('l50').disabled = true;
  shuffle(buttons().filter(b => b.lastChild.textContent !== S.cur.a)).slice(0, 2).forEach(b => { b.classList.add('hide'); b.disabled = true; });
};

$('laud').onclick = () => {
  S.life.laud = 0; $('laud').disabled = true;
  const gone = hidden();
  const accuracy = 0.95 - S.level * 0.04; // audience gets less sure as questions get harder
  const w = S.cur.opts.map(o => gone.includes(o) ? 0 : (o === S.cur.a && Math.random() < accuracy ? 40 + rnd(40) : 5 + rnd(30)));
  const sum = w.reduce((a, b) => a + b, 0);
  const pct = w.map(x => Math.round(x / sum * 100));
  dialog('📊 Ask the audience', `<div class="bars">${pct.map((p, i) => `<div class="bar"><span>${p}%</span><i style="height:${p}%"></i><b>${'ABCD'[i]}</b></div>`).join('')}</div>`);
};

$('lphone').onclick = () => {
  S.life.lphone = 0; $('lphone').disabled = true;
  const left = S.cur.opts.filter(o => !hidden().includes(o));
  const knows = Math.random() < 0.95 - S.level * 0.045;
  const guess = knows ? S.cur.a : left[rnd(left.length)];
  const letter = 'ABCD'[S.cur.opts.indexOf(guess)];
  const line = knows && S.level < 10 ? `Easy one — it's <b>${letter}: ${guess}</b>. I'm sure.`
    : knows ? `Hmm… I think it's <b>${letter}: ${guess}</b>. Pretty sure.`
    : `No idea, honestly. Maybe <b>${letter}: ${guess}</b>? Don't trust me.`;
  dialog('📞 Phone a friend', `<p>Your friend the car nerd says:</p><p>“${line}”</p>`);
};

$('walk').onclick = () => end(false, S.level ? PRIZES[S.level - 1] : 0, 'You walked away.');

function saveBest(n) { try { if (n > (+localStorage.carBest || 0)) localStorage.carBest = n; } catch {} }
function showBest() { let b = 0; try { b = +localStorage.carBest || 0; } catch {} $('best').textContent = b ? `Best win: ${euro(b)}` : ''; }

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  if (id === 'menu') { $('sub').textContent = 'Pick a category. 15 questions. 3 lifelines. €1,000,000.'; showBest(); }
}

$('cats').innerHTML = [['All', '🌍', `${BRANDS.length} brands · ${BRANDS.reduce((n, b) => n + b.models.length, 0)} models, mixed`]].concat(Object.entries(CATS).map(([k, c]) => [k, c.flag, `${c.brands.length} brands · ${BRANDS.filter(b => b.cat === k).reduce((n, b) => n + b.models.length, 0)} models`]))
  .map(([k, f, s]) => `<button class="cat" data-cat="${k}">${f} ${k === 'All' ? 'All cars' : k + ' cars'}<small>${s}</small></button>`).join('');
$('cats').onclick = e => { const b = e.target.closest('.cat'); if (b) start(b.dataset.cat); };
show('menu');
</script>
</body>
</html>
